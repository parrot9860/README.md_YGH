<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중첩목록</title>
</head>
<body>
    <ul type="square">
        <li><h4>과일</h4>
            <ol type="A">
                <li><i>복숭아</i></li>
                <li>샤인머스켓</li>
                <li>사과</li>
            </ol>
        </li>
        <li><b>채소</b>
            <ol>
                <li>배추</li>
                <li>당근</li>
                <li>양배추</li>
            </ol>
    </ul>
    <ul type="circle">
        <li>유재석</li>
        <li>전현무</li>
        <li>신동엽</li>
    </ul>
    <ol type="I">
        <li>사과</li>
        <li>복숭아</li>
        <li>샤인머스켓</li>
    </ol>
</body>
</html>
