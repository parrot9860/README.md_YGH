<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태이블 태그 셀 병합</title>
</head>
<body>
    <table border="1">
        <caption>홍차종류</caption>
        <tr>
            <th colspan="2">지역별홍차</th>
              
        </tr>
        <tr>
            <td rowspan="3"><b>중국</b></td>
            <td>정산소종</td>
        </tr>
        <tr>
            <td>기문</td>
        </tr>
        <tr>
            <td>운남</td>
        </tr>
        <tr>
            <th rowspan="4">인도 및 스리랑카</th>
            <td>아삼</td>
        </tr>
        <tr>
            <td>실론</td>
        </tr>
        <tr>
            <td>다질링</td>
        </tr>
        <tr>
            <td>닐기리</td>
        </tr>
    </table>
    <table border="1">
        <caption>셀병합</caption>
        <tr>
            <td colspan="2">1</td>
            <td>3</td>
            <td>4</td>
        </tr>
        <tr>
            <td colspan="4">5</td>
        </tr>
        <tr>
            <td rowspan="2">9</td>
            <td>10</td>
            <td>11</td>
            <td rowspan="2">12</td>
        </tr>
        <tr>
            <td>14</td>
            <td>15</td>
        </tr>
    </table>
</body>
</html>
