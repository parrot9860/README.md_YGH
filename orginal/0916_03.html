<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>중첩 목록</h3>
    <ol>
        <li>과일
            <ul type="disc">
                <li>사과</li>
                <li>오렌지</li>
                <li>포도</li>
            </ul>
        </li>
        <li>채소</li>
    </ol>
    <h3>순서가 있는 목록</h3>
    <ol type="I">
        <li>사과</li>
        <li>오렌지</li>
        <li>포도</li>
    </ol>
    <h3>순서가 없는 목록 ul</h3>
    <ul type="circle">       
        <li>사과</li>
        <li>오렌지</li>
        <li>포도</li>
    </ul>
</body>
</html>
