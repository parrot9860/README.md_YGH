<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중앙, 수평정렬</title>
    <style>
        /*초기화*/
        *{margin: 0; padding: 0;}
        /*중앙정렬*/
        #wrap{width: 780px; 
            margin: 0 auto;
        border: 1px solid red ;}
        #box1, #box2,#box3{width: 150px; height: 100px;}
        #inner{overflow: hidden;}  
        #box1 {background-color: red; float: left; 
        width: 200px; height: 100px; margin: 20px 0 0 20px;}
        #box2 {background-color: yellow; float: left;
        width: 300px; height: 300px; margin: 20px;}
        #box3 {background-color: blue;  float: left;
        width: 200px; height: 100px; margin-top: 20px;}
        #box4 {background-color: green; 
        width: 780px; height: 100px;}
        /* 수평정렬 :float */




    </style>
</head>
<body>
     <div id="wrap">
        <div id="inner">
        <div id="box1">박스1</div>
        <div id="box2">박스2</div>
        <div id="box3">박스3</div>
        </div>
        <div id="box4">박스4</div>
     </div>
</body>
</html>
