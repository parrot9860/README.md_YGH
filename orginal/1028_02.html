<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>헤더코딩</title>
    <style>
        /* 초기화 */
        *{margin: 0; padding: 0;}
        ul li{list-style: none;}
        /* 헤더 CSS */
        /* 중앙정렬:넓이를 주고 초기화를 한다 */
        #wrap{width: 1000px;    
             margin:0 auto;
        /*border: 1px solid red*/;
        }
        header{overflow: hidden;}
        h1{float: left; color: red; font-family: 'Times New Roman', Times, serif;}
        #top{float: right; overflow: hidden;}
        #top li{float: left; margin: 15px;}
        nav ul{overflow: hidden;}
        nav ul li{float: left; box-sizing: border-box; 
            width:200px; height: 60px; line-height: 60px; 
            background-color: red; color: white; 
            text-align: center; font-size: 1.1em; 
            /*padding: 15px; border: 1px solid red;*/ 
            font-weight: bold;}

        

    </style> 
</head>
<body>
    <div id="wrap">
        <header>
            <h1>DAELIM </h1>
                <ul id="top">
                    <li>로그인</li>
                    <li>회원가입</li>
                    <li>사이트맵</li>
                </ul>
            
        </header>
        <nav>
            <ul>
                <li>학원정보</li>
                <li>교육정보</li>
                <li>갤러리</li>
                <li>자격증정보</li>
                <li>기업/대학교육</li>
            </ul>
        </nav>
    </div>
    
</body>
</html>
